<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../postula/estilos.css">
    <!-- 1. Cargar Supabase desde el CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Cargar las credenciales desde config.js -->
</head>
<body>
    <a href="index.html">
        <div id="atras">Atrás</div>
    </a>
    <div class="form">
    <h1>Iniciar Sesión</h1>
    <form id="loginForm">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" required placeholder="tu@correo.com">
        <br><br>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" required placeholder="******">
        <br><br>
        <button type="submit">Iniciar Sesión</button>
    </form>
    </div>
<script>
    const supabaseClient = window.supabase.createClient(
        'https://eorctlkxihvxynooadfg.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvcmN0bGt4aWh2eHlub29hZGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTkzODIsImV4cCI6MjEwMjY5NTM4Mn0.SKeFWvo0DQymV_etSzl7C6ai_Om_tLaOuUraFI7MZzw'
    );

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            alert('Error al iniciar sesión: ' + error.message);
        } else {
            alert('¡Sesión iniciada con éxito!');
            console.log('Datos del usuario:', data.user);
        }
    });
</script>

</body>
</html>
