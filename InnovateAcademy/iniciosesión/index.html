<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../postula/estilos.css">
    <!-- 1. Cargar Supabase desde el CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Cargar las credenciales desde config.js -->
    <script src="config.js"></script>
</head>
<body>
    <a href="index.html">
        <div id="atras">Atrás</div>
    </a>
    <div class="form">
    <h1>Iniciar Sesión</h1>
    <form id="loginForm">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" required placeholder="tu@correo.com">
        <br><br>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" required placeholder="******">
        <br><br>
        <button type="submit">Iniciar Sesión</button>
    </form>
    </div>
    <script>
        // Declaramos la variable 'supabase' UNA sola vez en todo el proyecto
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Evento del formulario
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Intentar iniciar sesión con Supabase Auth
            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                alert('Error al iniciar sesión: ' + error.message);
            } else {
                alert('¡Sesión iniciada con éxito!');
                console.log('Datos del usuario:', data.user);
            }
        });
    </script>
</body>
</html>
